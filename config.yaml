game:
  name: "StarCraft: Brood War"
  install_path: "F:\\Game\\StarCraft"
  window_title: "Brood War"
  # Target capture resolution for visual RL (downscaled for CNN input efficiency)
  screen_width: 640
  screen_height: 480
  model_input_size: [128, 128]

rl:
  algorithm: "PPO"
  total_timesteps: 500000
  learning_rate: 0.0003
  gamma: 0.99
  batch_size: 64
  n_steps: 2048
  checkpoint_dir: "./checkpoints"
  log_dir: "./logs"

environment:
  action_delay: 0.1 # seconds between actions
  max_episode_steps: 1000
  reward_weights:
    win: 10.0
    loss: -10.0
    step_penalty: -0.001
